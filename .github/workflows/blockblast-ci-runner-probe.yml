name: BlockBlast Browser Matrix Closure

on:
  pull_request:
    paths:
      - '.github/workflows/blockblast-ci-runner-probe.yml'
      - 'blockblast-ci/phase10-browser-exact.tar.gz.b64'

permissions:
  contents: read

jobs:
  browser-matrix:
    name: Chromium Firefox WebKit read-only
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    env:
      E2E_BASE_URL: https://blockblast-unblocked.io
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact Phase 10 browser suite
        run: |
          mkdir -p blockblast-ci/browser-exact
          base64 -d blockblast-ci/phase10-browser-exact.tar.gz.b64 > blockblast-ci/browser-exact/fixture.tar.gz
          echo "f46bad285b12a8333955093d77847bb842d5e79e8f6e04993abde963f75c9a74  blockblast-ci/browser-exact/fixture.tar.gz" | sha256sum -c -
          tar -xzf blockblast-ci/browser-exact/fixture.tar.gz -C blockblast-ci/browser-exact
          cd blockblast-ci/browser-exact
          cat > SHA256SUMS <<'EOF'
          6d9f17a8b90f9f83c83c1a536dc459a7670d6d7409b601eb5722ddd543763281  tests/browser/playwright.config.cjs
          d28d9971a8696b6e49a8e01fe0973b6f3d37d4482c20e67c57cc5e5316b47324  tests/browser/helpers.cjs
          f2c6ef50340894aaf60577e6986bca4c295d2c3a6835dbdd3c9e4c3d4b340fcc  tests/browser/public-readonly.spec.cjs
          59fbdd2c0bac992f0f07c61069173e014157736202bc4bfc26755fa5bb63de19  tests/browser/pwa-readonly.spec.cjs
          EOF
          sed -i 's/^          //' SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Install pinned Playwright test runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @playwright/test@1.63.0

      - name: Run exact read-only and PWA matrix
        run: npx playwright test -c blockblast-ci/browser-exact/tests/browser/playwright.config.cjs --grep '@readonly|@pwa'
