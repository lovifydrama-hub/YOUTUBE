name: BlockBlast Phase 10 SQLite Closure

on:
  pull_request:
    paths:
      - '.github/workflows/blockblast-ci-runner-probe.yml'
      - 'blockblast-ci/phase10-sqlite-exact.tar.gz.b64'

permissions:
  contents: read

jobs:
  sqlite-closure:
    name: PHP ${{ matrix.php }} SQLite closure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none
        env:
          fail-fast: true

      - name: Verify SQLite extensions
        run: |
          php -r 'if (!extension_loaded("pdo_sqlite") || !extension_loaded("sqlite3")) { fwrite(STDERR, "SQLite extension missing\n"); exit(1); } echo "pdo_sqlite+sqlite3 loaded\n";'

      - name: Reconstruct exact Phase 10 fixture
        run: |
          mkdir -p blockblast-ci/exact
          base64 -d blockblast-ci/phase10-sqlite-exact.tar.gz.b64 > blockblast-ci/exact/fixture.tar.gz
          echo "c09c5b0d0c2913bff92889764442e0be8708d1dd1133f26716f5ca973907432f  blockblast-ci/exact/fixture.tar.gz" | sha256sum -c -
          tar -xzf blockblast-ci/exact/fixture.tar.gz -C blockblast-ci/exact
          cd blockblast-ci/exact
          cat > SHA256SUMS <<'EOF'
          30f8adab20c9af8d41ef1a81b5a20de461ea68f3f87efa8d1c705d532cf5cf98  includes/admin-session-revocation.php
          e70cecc38dc0f007e25acf1dfc1d73ca34fbacd629a9ae3d853c6e642bc628c4  includes/page-functions.php
          9e615a09e9f8700f9bf4d78224e69f2ceeff87ca6ee6d1a1316321fdaeccb553  tests/auth-session-revocation-regression.php
          d3d9b931a22d71fd6506c6b3c684a4bf6ea00fdde613088405c04f1db22cd73b  tests/comment-game-scope-test.php
          8fe92a54c2cb3c21b47ab7d6a770eeeeddda999b88cb6d0651a639f883a15ce3  tests/content-boundary-regression.php
          EOF
          sed -i 's/^          //' SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Syntax check exact fixture
        run: |
          find blockblast-ci/exact/includes blockblast-ci/exact/tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run previously blocked regressions
        working-directory: blockblast-ci/exact
        run: |
          php tests/auth-session-revocation-regression.php
          php tests/comment-game-scope-test.php
          php tests/content-boundary-regression.php
